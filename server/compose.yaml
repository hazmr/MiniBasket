name: minibasket

services:
  postgres:
    image: 'postgres:18-alpine'
    environment:
      POSTGRES_DB: minibasket
      POSTGRES_USER: minibasket
      POSTGRES_PASSWORD: minibasket
    ports:
      - '5432'
    volumes:
      - minibasket-data:/var/lib/postgresql

  redis:
    image: 'redis:8-alpine'
    ports:
      - '6379:6379'

  minio:
    image: 'bitnamilegacy/minio:2025.5.24'
    environment:
      MINIO_ROOT_USER: minibasket
      MINIO_ROOT_PASSWORD: minibasket-secret
      MINIO_DEFAULT_BUCKETS: 'minibasket:download'
    ports:
      - '9000:9000'
    volumes:
      - minibasket-files:/bitnami/minio/data

  mailpit:
    image: 'axllent/mailpit:v1.29'
    ports:
      - '1026:1025'
      - '8026:8025'

volumes:
  minibasket-data:
  minibasket-files:

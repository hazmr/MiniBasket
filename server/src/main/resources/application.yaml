spring:
  application:
    name: MiniBasket
  config:
    import: optional:file:.env[.properties]
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 2s
      connect-timeout: 2s
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiration: 1h
  storage:
    endpoint: ${STORAGE_ENDPOINT:}
    region: ${STORAGE_REGION:auto}
    bucket: ${STORAGE_BUCKET:}
    access-key-id: ${STORAGE_ACCESS_KEY_ID:}
    secret-access-key: ${STORAGE_SECRET_ACCESS_KEY:}
    public-url: ${STORAGE_PUBLIC_URL:}
    upload-url-expiry: 10m
    max-upload-size: 5MB
  email:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:MiniBasket <no-reply@minibasket.local>}
    frontend-url: ${FRONTEND_URL:http://localhost:3000}

  rate-limit:
    login:
      max-attempts: 10
      window: 15m
    password-reset:
      max-attempts: 3
      window: 1h

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      roles: ADMIN
  health:
    mail:
      enabled: false

logging:
  pattern:
    correlation: "[%X{traceId:-}] "

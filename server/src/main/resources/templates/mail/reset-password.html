<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset your MiniBasket password</title>
</head>
<body style="margin:0;background:#f7f8f6">
<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#18201b">
  <p th:replace="~{mail/parts :: logo}"></p>
  <p style="font-size:15px;line-height:1.5">Someone asked to reset the password for your MiniBasket account.</p>
  <p th:replace="~{mail/parts :: button(${link}, 'Choose a new password')}"></p>
  <p style="font-size:13px;color:#5b675f">
    This link works for 1 hour. If you didn't ask for this, ignore this email: your password stays the same.
  </p>
  <p th:replace="~{mail/parts :: fallback(${link})}"></p>
</div>
</body>
</html>
